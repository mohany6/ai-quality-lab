name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Unit tests
        run: pytest --junitxml=artifacts/pytest_junit.xml --cov=ai_quality_lab --cov-report=term-missing

      - name: Golden Q&A quality gate
        run: python scripts/run_quality_gates.py

      - name: RAG quality gate
        run: python scripts/run_rag_eval.py

      - name: Upload quality artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-artifacts-py${{ matrix.python-version }}
          path: artifacts/
          if-no-files-found: warn
